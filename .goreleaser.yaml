version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pets
    main: ./cmd/pets
    binary: pets
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: parallel-harness-pets
    repository:
      owner: TevanB
      name: homebrew-tap
    homepage: https://github.com/TevanB/parallel-harness-pets
    description: A creature for every worktree, in your agent's status line
    license: MIT
    binaries:
      - pets
    hooks:
      post:
        # Homebrew quarantines cask payloads, and an unsigned binary then fails
        # Gatekeeper on first run. Formulas did not need this; casks do.
        install: |
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/pets"],
                         must_succeed: false

scoops:
  - repository:
      owner: TevanB
      name: scoop-bucket
    homepage: https://github.com/TevanB/parallel-harness-pets
    description: A creature for every worktree, in your agent's status line
    license: MIT
